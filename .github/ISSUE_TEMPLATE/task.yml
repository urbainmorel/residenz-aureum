name: Tâche projet
description: Proposer une évolution, une correction ou un travail de gouvernance.
title: "[Tâche] "
labels:
  - "type:chore"
body:
  - type: markdown
    attributes:
      value: |
        Ne publiez aucun secret, donnée personnelle de résident, clé API ou information médicale dans cette issue.

  - type: dropdown
    id: area
    attributes:
      label: Domaine principal
      description: Choisissez le domaine qui pilotera le travail.
      options:
        - Contenu
        - Design et accessibilité
        - Frontend et performance
        - Backend et sécurité
        - QA
        - Gouvernance
    validations:
      required: true

  - type: textarea
    id: outcome
    attributes:
      label: Résultat attendu
      description: Décrivez le comportement ou le livrable attendu, sans imposer une solution prématurée.
      placeholder: À la fin de cette tâche…
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Contexte et sources
      description: Indiquez les documents, routes, maquettes, preuves client ou issues liés.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Critères d’acceptation
      description: Fournissez une liste vérifiable incluant les deux langues et les cas d’erreur si pertinents.
      placeholder: |
        - [ ] …
        - [ ] …
    validations:
      required: true

  - type: textarea
    id: risks
    attributes:
      label: Risques et dépendances
      description: Signalez notamment les validations client, contenus mockés, impacts SEO, sécurité ou accessibilité.

  - type: checkboxes
    id: governance
    attributes:
      label: Engagements
      options:
        - label: Cette issue ne contient ni secret ni donnée personnelle sensible.
          required: true
        - label: Les informations non validées seront traitées comme des mocks visibles et exclues des données structurées.
          required: true
